name: OLX Views Tracker

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: false
        default: "scrape"
        type: choice
        options:
          - scrape
          - bot

jobs:
  scrape:
    name: Scrape & Notify
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape')

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Install Python deps
        run: pip install selenium requests webdriver-manager

      - name: Restore cached data
        uses: actions/cache@v4
        with:
          path: data/
          key: olx-data-${{ github.run_id }}
          restore-keys: olx-data-

      - name: Run scraper with virtual display
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISPLAY: :99
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          python scraper.py

      - name: Commit updated data
        run: |
          git config user.name  "olx-tracker-bot"
          git config user.email "bot@olx-tracker"
          git add data/listings.json data/views_history.json data/telegram_offset.json
          git diff --staged --quiet || git commit -m "📊 Views update $(date +'%Y-%m-%d')"
          git push

  bot:
    name: Telegram Bot
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'bot'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Restore cached data
        uses: actions/cache@v4
        with:
          path: data/
          key: olx-data-${{ github.run_id }}
          restore-keys: olx-data-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit updated config
        run: |
          git config user.name  "olx-tracker-bot"
          git config user.email "bot@olx-tracker"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 Bot config update $(date +'%Y-%m-%d %H:%M')"
          git push
