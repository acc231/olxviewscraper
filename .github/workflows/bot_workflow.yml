name: OLX Telegram Bot

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

jobs:
  bot:
    name: Telegram Bot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Restore cached data
        uses: actions/cache@v4
        with:
          path: data/
          key: olx-data-${{ github.run_id }}
          restore-keys: olx-data-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit updated config
        run: |
          git config user.name  "olx-tracker-bot"
          git config user.email "bot@olx-tracker"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 Bot update $(date +'%Y-%m-%d %H:%M')"
          git push
